[project]
name = "nanoserve"
version = "0.1.0"
description = "An LLM inference engine from scratch: paged KV cache, continuous batching, chunked prefill, speculative decoding."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5",
  "triton>=3.0",
  "safetensors",
  "huggingface_hub",
  "tokenizers",
  "fastapi",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "transformers>=4.45", "httpx", "numpy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nanoserve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU and the Qwen2.5-0.5B weights"]
